name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Build unit tests
        run: scons tests

      - name: Run unit tests
        shell: bash
        run: ./bin/tests/mv_tests

      - name: Write JUnit report
        if: always()
        shell: bash
        run: ./bin/tests/mv_tests --reporters=junit --out=unit_results.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: unit-results-${{ matrix.os }}
          path: unit_results.xml
